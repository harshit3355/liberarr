name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native arm64 runner: aws-lc-sys and rusqlite need a native C toolchain, so no cross-compiling.
          # Ubuntu 22.04 (glibc 2.35) keeps the binaries running on Debian 12 and similar NAS systems.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # No npm cache on a release: a poisoned cache would end up in the published binary.
          package-manager-cache: false
      - name: Build the web UI (embedded in the binary)
        working-directory: web
        run: npm ci && npm run build
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install the BlueZ client headers (btleplug on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release --locked
      - name: Package
        run: |
          version="$(./target/release/liberarr --version)"
          if [ "$version" != "liberarr ${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match '$version'" >&2
            exit 1
          fi
          name="liberarr-${{ matrix.target }}"
          tar -C target/release -czf "$name.tar.gz" liberarr
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liberarr-${{ matrix.target }}
          path: |
            liberarr-${{ matrix.target }}.tar.gz
            liberarr-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
