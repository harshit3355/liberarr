[package]
name = "liberarr-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
liberarr-core = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
# spawn_blocking for the synchronous SQLite adapters (core stays runtime-free).
tokio = { workspace = true, features = ["rt"] }
# rustls only: no OpenSSL on the host.
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net"] }
# In-process mock provider for the AI client tests.
axum = { workspace = true }
