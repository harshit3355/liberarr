[project]
name = "liberarr"
version = "0.1.0"
description = "Self-hosted transcription and AI summaries for voice recorders"
authors = [
    { name = "hocine hacherouf", email = "hacherouf.hocine@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "openai>=3.44.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
