[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/hocinehacherouf/liberarr"

[workspace.dependencies]
liberarr-core = { path = "crates/liberarr-core" }
liberarr-infra = { path = "crates/liberarr-infra" }
liberarr-web = { path = "crates/liberarr-web" }
clap = { version = "=4.6.7", features = ["derive"] }
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
jiff = "=0.2.38"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rsa = "=0.9.10"
chacha20poly1305 = "=0.11.0"
chacha20 = "=0.10.2"
rand_chacha = "=0.3.1"
sha2 = "=0.11.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = "=1.54.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "multipart"] }
axum = "=0.8.9"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["fs"] }
subtle = "=2.6.1"
btleplug = "=0.13.5"
futures = "=0.3.34"
base64 = "=0.23.1"
hkdf = "=0.13.0"
hmac = "=0.13.0"
aes = "=0.9.3"
cbc = { version = "=0.2.1", features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
