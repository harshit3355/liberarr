[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/hocinehacherouf/liberarr"

[workspace.dependencies]
liberarr-core = { path = "crates/liberarr-core" }
liberarr-infra = { path = "crates/liberarr-infra" }
liberarr-web = { path = "crates/liberarr-web" }
clap = { version = "=4.6.7", features = ["derive"] }
rust-embed = "=8.13.0"
jiff = "=0.2.38"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rsa = "=0.9.10"
chacha20poly1305 = "=0.11.0"
chacha20 = "=0.10.2"
rand_chacha = "=0.3.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
